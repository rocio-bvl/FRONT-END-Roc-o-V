<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - SportClub</title>

    <!-- CSS exclusivo para la página de registro -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <main class="container">

        <img src="img/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo">
        <form class="card">
            <h2>Crear Cuenta</h2>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre"> 

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo"> 

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Crea una contraseña">

            <label for="password">Confirmar Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña">

            <button type="submit">Registrarse</button>

            <a href="login.html" class="link">Regresar a Inicio de Sesión</a>
        </form>
</body>
</html>
