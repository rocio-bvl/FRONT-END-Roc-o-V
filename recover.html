<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Recuperación Contraseña - SportClub</title>

    <!-- CSS exclusivo para la página de recuperación contraseña -->
    <link rel="stylesheet" href="css/recover.css">
</head>

<body>

        <img src="img/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo">

            <label for="correo">Correo electrónico</label>

        </form>

</body>
